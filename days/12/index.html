<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 12 · Pointy</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --blue:#0071e3;
    --blue-light:#2997ff;
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% 50%, #0d1a2e, #000 70%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav a.back{ color:var(--blue-light); text-decoration:none; font-size:0.85rem; font-weight:500; }
  nav a.back:hover{ text-decoration:underline; }
  nav .label{ color:var(--muted); font-size:0.8rem; }

  .caption{
    position:absolute;
    top:80px;
    left:0; right:0;
    text-align:center;
    z-index:2;
    pointer-events:none;
    padding:0 20px;
  }
  .caption h1{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 10px;
    background:linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .caption p{ color:var(--muted); font-size:0.92rem; line-height:1.6; }
  .tag{
    display:inline-block;
    margin-top:16px;
    font-size:0.78rem;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    padding:8px 18px;
    border-radius:999px;
  }

  .core{
    position:relative;
    width:40px;
    height:40px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 30px rgba(255,255,255,0.4);
    z-index:1;
  }
  .arrow{
    position:absolute;
    top:50%; left:50%;
    width:0; height:0;
    border-left:16px solid transparent;
    border-right:16px solid transparent;
    border-bottom:36px solid var(--blue-light);
    transform-origin:50% 90%;
    filter:drop-shadow(0 0 10px rgba(41,151,255,0.6));
  }
</style>
</head>
<body>
<nav>
  <a class="back" href="../../">‹ Weird October</a>
  <span class="label">Day 12 · Pointy</span>
</nav>

<div class="caption">
  <h1>It's pointing at you.</h1>
  <p>Move your cursor anywhere. It will always know exactly where you are.</p>
  <span class="tag">Day 12 · Pointy</span>
</div>

<div class="core">
  <div class="arrow" id="arrow"></div>
</div>

<script>
  var arrow = document.getElementById('arrow');
  var core = document.querySelector('.core');
  var mouseX = window.innerWidth / 2;
  var mouseY = window.innerHeight / 2 - 120;

  window.addEventListener('mousemove', function(e){
    mouseX = e.clientX;
    mouseY = e.clientY;
  });
  window.addEventListener('touchmove', function(e){
    var t = e.touches[0];
    if (t){ mouseX = t.clientX; mouseY = t.clientY; }
  });

  function tick(){
    var rect = core.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var angle = Math.atan2(mouseY - cy, mouseX - cx) * (180 / Math.PI) + 90;
    arrow.style.transform = 'translate(-50%,-90%) rotate(' + angle + 'deg)';
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
