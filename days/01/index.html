<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 1 · Reveal</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --blue:#0071e3;
    --blue-light:#2997ff;
    --red:#ff3b30;
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
  }
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav a.back{
    color:var(--blue-light);
    text-decoration:none;
    font-size:0.85rem;
    font-weight:500;
  }
  nav a.back:hover{ text-decoration:underline; }
  nav .label{ color:var(--muted); font-size:0.8rem; }

  .stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .reveal{
    position:relative;
    z-index:1;
    max-width:560px;
    padding:0 24px;
    opacity:0;
  }
  body.open .reveal{
    animation:riseIn 0.9s var(--ease) 0.3s forwards;
  }
  @keyframes riseIn{
    0%{ opacity:0; transform:translateY(24px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  .reveal h1{
    font-size:clamp(2.2rem, 7vw, 3.6rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 14px;
    background:linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .reveal p{
    color:var(--muted);
    font-size:1.05rem;
    line-height:1.6;
    margin:0;
  }
  .reveal .tag{
    display:inline-block;
    margin-top:22px;
    font-size:0.78rem;
    font-weight:600;
    letter-spacing:0.2px;
    color:#fff;
    background:var(--blue);
    padding:8px 18px;
    border-radius:999px;
  }

  .curtain{
    position:absolute;
    top:0;
    height:100%;
    width:50%;
    background:
      linear-gradient(180deg, #1c1c1e, #000 70%);
    z-index:2;
    transition:transform 1.1s var(--ease);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .curtain::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(255,255,255,0.05), transparent 60%);
  }
  .curtain.left{ left:0; }
  .curtain.right{ right:0; }
  body.open .curtain.left{ transform:translateX(-105%); }
  body.open .curtain.right{ transform:translateX(105%); }

  .wordmark{
    color:rgba(255,255,255,0.18);
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .curtain.left .wordmark{ margin-left:auto; margin-right:40px; }
  .curtain.right .wordmark{ margin-right:auto; margin-left:40px; }

  .hint{
    position:absolute;
    bottom:32px;
    left:0; right:0;
    z-index:3;
    text-align:center;
    font-size:0.78rem;
    letter-spacing:0.2px;
    font-weight:500;
    color:var(--muted);
    animation:pulse 1.8s infinite ease-in-out;
    pointer-events:none;
  }
  body.open .hint{ display:none; }
  @keyframes pulse{
    0%,100%{ opacity:0.4; }
    50%{ opacity:0.9; }
  }

  .dot{
    width:84px;
    height:84px;
    margin:0 auto 20px;
    border-radius:50%;
    background:linear-gradient(145deg, var(--blue-light), var(--blue));
    box-shadow:0 10px 30px rgba(0,113,227,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
  }
</style>
</head>
<body>
<nav>
  <a class="back" href="../../">‹ Weird October</a>
  <span class="label">Day 1 · Reveal</span>
</nav>

<div class="stage">
  <div class="reveal">
    <div class="dot">✦</div>
    <h1>It's October.</h1>
    <p>Thirty-one days, thirty-one tiny websites.<br>This one just wanted you to open the curtain first.</p>
    <span class="tag">Day 1 · Reveal</span>
  </div>
  <div class="curtain left"><span class="wordmark">WEIRD</span></div>
  <div class="curtain right"><span class="wordmark">OCTOBER</span></div>
  <div class="hint">Click anywhere to reveal</div>
</div>
<script>
  document.body.addEventListener('click', function(){
    document.body.classList.add('open');
  }, { once:true });
</script>
</body>
</html>
