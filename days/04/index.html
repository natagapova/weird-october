<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 4 · Plastic</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --blue:#0071e3;
    --blue-light:#2997ff;
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 30% 20%, #10213a, #000 70%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:90px 16px 40px;
    user-select:none;
  }
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav a.back{ color:var(--blue-light); text-decoration:none; font-size:0.85rem; font-weight:500; }
  nav a.back:hover{ text-decoration:underline; }
  nav .label{ color:var(--muted); font-size:0.8rem; }

  h1{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 6px;
    background:linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  p.sub{
    color:var(--muted);
    font-size:0.92rem;
    margin:0 0 32px;
    text-align:center;
  }
  .sheet{
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:8px;
    max-width:560px;
  }
  .bubble{
    width:56px;
    height:56px;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.5), rgba(255,255,255,0.08) 45%, transparent 60%),
      rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.3),
      inset 0 -4px 6px rgba(0,0,0,0.3),
      0 4px 10px rgba(0,0,0,0.3);
    cursor:pointer;
    transition:transform 0.12s var(--ease), box-shadow 0.12s var(--ease);
    backdrop-filter:blur(6px);
  }
  .bubble:active{ transform:scale(0.88); }
  .bubble.popped{
    background:rgba(0,113,227,0.15);
    border-color:rgba(41,151,255,0.4);
    box-shadow:inset 0 2px 8px rgba(0,0,0,0.5);
    transform:scale(0.8);
    pointer-events:none;
  }
  .status{
    margin-top:28px;
    font-size:0.82rem;
    color:var(--muted);
    font-weight:500;
  }
  .tag{
    display:inline-block;
    margin-top:16px;
    font-size:0.78rem;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    padding:8px 18px;
    border-radius:999px;
  }
</style>
</head>
<body>
<nav>
  <a class="back" href="../../">‹ Weird October</a>
  <span class="label">Day 4 · Plastic</span>
</nav>
<h1>Pop the plastic.</h1>
<p class="sub">It's bubble wrap. That's it. That's the whole website.</p>
<div class="sheet" id="sheet"></div>
<div class="status" id="status">0 / 40 popped</div>
<span class="tag">Day 4 · Plastic</span>

<script>
  var sheet = document.getElementById('sheet');
  var status = document.getElementById('status');
  var total = 40;
  var popped = 0;

  for (var i = 0; i < total; i++){
    var b = document.createElement('div');
    b.className = 'bubble';
    b.addEventListener('click', function(){
      if (this.classList.contains('popped')) return;
      this.classList.add('popped');
      popped++;
      status.textContent = popped === total
        ? 'All popped. Go outside.'
        : popped + ' / ' + total + ' popped';
    });
    sheet.appendChild(b);
  }
</script>
</body>
</html>
