<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 22 · Skeletons</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --blue:#0071e3;
    --blue-light:#2997ff;
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% 20%, #14151c, #000 70%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:90px 16px 40px;
    user-select:none;
  }
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav a.back{ color:var(--blue-light); text-decoration:none; font-size:0.85rem; font-weight:500; }
  nav a.back:hover{ text-decoration:underline; }
  nav .label{ color:var(--muted); font-size:0.8rem; }

  .caption{
    text-align:center;
    margin-bottom:14px;
    max-width:440px;
  }
  .caption h1{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 10px;
    background:linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .caption p{ color:var(--muted); font-size:0.92rem; line-height:1.6; }

  .stats{
    display:flex;
    gap:24px;
    margin-bottom:18px;
    font-size:0.85rem;
    color:var(--muted);
  }
  .stats b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  .board{
    display:grid;
    grid-template-columns:repeat(3, 84px);
    grid-template-rows:repeat(3, 84px);
    gap:14px;
  }
  .hole{
    position:relative;
    width:84px;
    height:84px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 40%, #2a2a2e, #050505 72%);
    box-shadow:inset 0 10px 18px rgba(0,0,0,0.7), 0 2px 0 rgba(255,255,255,0.03);
    overflow:hidden;
    cursor:pointer;
  }
  .bone{
    position:absolute;
    left:50%;
    bottom:-50px;
    width:46px;
    height:46px;
    margin-left:-23px;
    font-size:2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:bottom 0.18s cubic-bezier(.34,1.56,.64,1);
  }
  .hole.up .bone{ bottom:14px; }
  .hole.whacked .bone{
    bottom:14px;
    transform:scale(0.6) rotate(20deg);
    opacity:0.4;
    transition:transform 0.15s var(--ease), opacity 0.15s var(--ease);
  }

  .result{
    margin-top:18px;
    font-size:0.95rem;
    color:var(--ink);
    text-align:center;
    max-width:380px;
    min-height:22px;
  }
  .playBtn{
    margin-top:10px;
    font-family:inherit;
    font-size:0.82rem;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    border:none;
    padding:9px 20px;
    border-radius:999px;
    cursor:pointer;
    display:none;
  }
  .tag{
    display:inline-block;
    margin-top:14px;
    font-size:0.78rem;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    padding:8px 18px;
    border-radius:999px;
  }
</style>
</head>
<body>
<nav>
  <a class="back" href="../../">‹ Weird October</a>
  <span class="label">Day 22 · Skeletons</span>
</nav>

<div class="caption">
  <h1>Whack-a-bone.</h1>
  <p>Bones keep popping up. Click them before they duck back down. Gets faster as you go.</p>
</div>

<div class="stats">
  <span>Score: <b id="score">0</b></span>
  <span>Time: <b id="time">30</b>s</span>
</div>

<div class="board" id="board"></div>

<button class="playBtn" id="startBtn" style="display:inline-block;">start</button>
<div class="result" id="result">&nbsp;</div>
<button class="playBtn" id="playBtn">play again</button>
<span class="tag">Day 22 · Skeletons</span>

<script>
  var board = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var timeEl = document.getElementById('time');
  var result = document.getElementById('result');
  var playBtn = document.getElementById('playBtn');
  var startBtn = document.getElementById('startBtn');

  var HOLE_COUNT = 9;
  var GAME_SECONDS = 30;
  var holes = [];
  var score, timeLeft, running, spawnTimeout, countdownInterval;

  for (var i = 0; i < HOLE_COUNT; i++){
    var hole = document.createElement('div');
    hole.className = 'hole';
    var bone = document.createElement('div');
    bone.className = 'bone';
    bone.textContent = '🦴';
    hole.appendChild(bone);
    board.appendChild(hole);
    holes.push(hole);

    hole.addEventListener('click', (function(h){
      return function(){ whack(h); };
    })(hole));
  }

  function whack(hole){
    if (!running || !hole.classList.contains('up')) return;
    hole.classList.remove('up');
    hole.classList.add('whacked');
    score++;
    scoreEl.textContent = score;
    setTimeout(function(){ hole.classList.remove('whacked'); }, 200);
  }

  function popRandom(){
    if (!running) return;
    var candidates = holes.filter(function(h){ return !h.classList.contains('up'); });
    if (candidates.length){
      var hole = candidates[Math.floor(Math.random() * candidates.length)];
      hole.classList.add('up');

      var elapsed = GAME_SECONDS - timeLeft;
      var visibleFor = Math.max(500, 1100 - elapsed * 22);
      setTimeout(function(){
        hole.classList.remove('up');
      }, visibleFor);
    }

    var nextDelay = Math.max(260, 700 - (GAME_SECONDS - timeLeft) * 14);
    spawnTimeout = setTimeout(popRandom, nextDelay);
  }

  function startGame(){
    score = 0;
    timeLeft = GAME_SECONDS;
    running = true;
    scoreEl.textContent = '0';
    timeEl.textContent = GAME_SECONDS;
    result.textContent = '';
    playBtn.style.display = 'none';
    holes.forEach(function(h){ h.classList.remove('up', 'whacked'); });

    clearTimeout(spawnTimeout);
    clearInterval(countdownInterval);

    countdownInterval = setInterval(function(){
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);

    popRandom();
  }

  function endGame(){
    running = false;
    clearTimeout(spawnTimeout);
    clearInterval(countdownInterval);
    holes.forEach(function(h){ h.classList.remove('up'); });
    result.textContent = 'Time’s up — you whacked ' + score + ' bone' + (score === 1 ? '' : 's') + '.';
    playBtn.style.display = 'inline-block';
  }

  startBtn.addEventListener('click', function(){
    startBtn.style.display = 'none';
    startGame();
  });
  playBtn.addEventListener('click', startGame);
</script>
</body>
</html>
