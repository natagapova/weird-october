<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 7 · Organic</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --green:#30d158;
    --green-dark:#1f9e40;
    --blue:#0071e3;
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% 100%, #0c1f10, #000 70%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    position:relative;
    cursor:pointer;
  }
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav a.back{ color:var(--blue); text-decoration:none; font-size:0.85rem; font-weight:500; }
  nav a.back:hover{ text-decoration:underline; }
  nav .label{ color:var(--muted); font-size:0.8rem; }

  .caption{
    position:absolute;
    top:70px;
    left:0; right:0;
    text-align:center;
    z-index:3;
    pointer-events:none;
    padding:0 20px;
  }
  .caption h1{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 10px;
    background:linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .caption p{ color:var(--muted); font-size:0.92rem; line-height:1.6; }
  .tag{
    display:inline-block;
    margin-top:16px;
    font-size:0.78rem;
    font-weight:600;
    color:#000;
    background:var(--green);
    padding:8px 18px;
    border-radius:999px;
  }
  svg{
    width:100%;
    height:65vh;
    position:relative;
    z-index:1;
  }
  .soil{
    width:100%;
    height:28px;
    background:#0a0a0c;
    border-top:1px solid rgba(255,255,255,0.08);
    position:relative;
    z-index:2;
  }
</style>
</head>
<body>
<nav>
  <a class="back" href="../../">‹ Weird October</a>
  <span class="label">Day 7 · Organic</span>
</nav>
<div class="caption">
  <h1>Click to grow.</h1>
  <p>Every click sends out a new vine. Nothing symmetrical, nothing planned — just growing.</p>
  <span class="tag">Day 7 · Organic</span>
</div>
<svg id="garden" viewBox="0 0 800 600" preserveAspectRatio="xMidYMax meet"></svg>
<div class="soil"></div>

<script>
  var svg = document.getElementById('garden');
  var NS = 'http://www.w3.org/2000/svg';

  function rand(a, b){ return a + Math.random() * (b - a); }

  function leaf(x, y, angle, scale){
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', 'translate(' + x + ',' + y + ') rotate(' + angle + ') scale(' + scale + ')');
    var path = document.createElementNS(NS, 'path');
    path.setAttribute('d', 'M0,0 C 10,-18 30,-18 36,0 C 30,18 10,18 0,0 Z');
    path.setAttribute('fill', Math.random() < 0.5 ? '#30d158' : '#1f9e40');
    path.setAttribute('opacity', '0');
    g.appendChild(path);
    svg.appendChild(g);
    path.animate([{opacity:0, transform:'scale(0)'},{opacity:1, transform:'scale(1)'}], {duration:400, fill:'forwards', easing:'ease-out'});
    return g;
  }

  function growVine(baseX){
    var x = baseX;
    var y = 600;
    var segments = Math.floor(rand(5, 10));
    var d = 'M' + x + ',' + y;
    var dir = rand(-1, 1);

    var points = [[x, y]];
    for (var i = 0; i < segments; i++){
      dir += rand(-0.5, 0.5);
      dir = Math.max(-1.3, Math.min(1.3, dir));
      x += dir * rand(14, 26);
      y -= rand(32, 48);
      var cx = points[points.length-1][0] + dir * 10;
      var cy = points[points.length-1][1] - 20;
      d += ' Q' + cx + ',' + cy + ' ' + x + ',' + y;
      points.push([x, y]);
    }

    var path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#1f9e40');
    path.setAttribute('stroke-width', '4');
    path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(path);

    var len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.animate(
      [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
      { duration: 900, easing: 'ease-out', fill: 'forwards' }
    );

    points.forEach(function(p, idx){
      if (idx === 0 || idx % 2 !== 0) return;
      setTimeout(function(){
        leaf(p[0] + rand(-6,6), p[1], rand(0,360), rand(0.6, 1.1));
      }, idx * 90 + 200);
    });
  }

  document.body.addEventListener('click', function(e){
    var x = (e.clientX / window.innerWidth) * 800;
    growVine(x);
  });

  growVine(400);
</script>
</body>
</html>
