<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 23 · Incognito</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --blue:#0071e3;
    --blue-light:#2997ff;
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% 20%, #14151c, #000 70%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:90px 16px 40px;
  }
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav a.back{ color:var(--blue-light); text-decoration:none; font-size:0.85rem; font-weight:500; }
  nav a.back:hover{ text-decoration:underline; }
  nav .label{ color:var(--muted); font-size:0.8rem; }

  .caption{
    text-align:center;
    margin-bottom:26px;
    max-width:440px;
  }
  .caption h1{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 10px;
    background:linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .caption p{ color:var(--muted); font-size:0.92rem; line-height:1.6; }

  .box{
    position:relative;
    width:min(420px, 88vw);
  }
  textarea{
    width:100%;
    height:140px;
    resize:none;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:16px;
    padding:16px;
    color:var(--ink);
    font-family:inherit;
    font-size:1rem;
    line-height:1.5;
    outline:none;
    transition:opacity 1.1s var(--ease);
  }
  textarea::placeholder{ color:var(--muted); }
  textarea:focus{ border-color:rgba(0,113,227,0.5); }

  .status{
    margin-top:14px;
    font-size:0.82rem;
    color:var(--muted);
    text-align:center;
    min-height:18px;
  }
  .stat{
    margin-top:4px;
    font-size:0.78rem;
    color:var(--muted);
    text-align:center;
  }
  .stat b{ color:var(--blue-light); font-variant-numeric:tabular-nums; }

  .tag{
    display:inline-block;
    margin-top:16px;
    font-size:0.78rem;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    padding:8px 18px;
    border-radius:999px;
  }
</style>
</head>
<body>
<nav>
  <a class="back" href="../../">‹ Weird October</a>
  <span class="label">Day 23 · Incognito</span>
</nav>

<div class="caption">
  <h1>Nothing is saved here.</h1>
  <p>Type something. Stop for a moment and watch it disappear — nothing you write here is ever kept.</p>
</div>

<div class="box">
  <textarea id="box" placeholder="type something..." spellcheck="false"></textarea>
</div>
<div class="status" id="status">&nbsp;</div>
<div class="stat">Characters forgotten so far: <b id="forgotten">0</b></div>
<span class="tag">Day 23 · Incognito</span>

<script>
  var box = document.getElementById('box');
  var status = document.getElementById('status');
  var forgottenEl = document.getElementById('forgotten');

  var forgotten = 0;
  var idleTimer = null;
  var IDLE_DELAY = 1600;

  box.addEventListener('input', function(){
    status.textContent = 'remembering, for now…';
    box.style.opacity = '1';
    clearTimeout(idleTimer);
    if (box.value.length === 0) return;
    idleTimer = setTimeout(forget, IDLE_DELAY);
  });

  function forget(){
    var len = box.value.length;
    if (len === 0) return;
    status.textContent = 'forgetting…';
    box.style.opacity = '0';
    setTimeout(function(){
      forgotten += len;
      forgottenEl.textContent = forgotten;
      box.value = '';
      box.style.opacity = '1';
      status.textContent = 'forgotten.';
    }, 1100);
  }
</script>
</body>
</html>
