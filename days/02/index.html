<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 2 · Spark</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --blue:#0071e3;
    --blue-light:#2997ff;
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% 30%, #0a1a2e, #000 70%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:crosshair;
    position:relative;
  }
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:5;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav a.back{ color:var(--blue-light); text-decoration:none; font-size:0.85rem; font-weight:500; }
  nav a.back:hover{ text-decoration:underline; }
  nav .label{ color:var(--muted); font-size:0.8rem; }
  canvas{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
  }
  .center{
    position:relative;
    z-index:2;
    text-align:center;
    pointer-events:none;
    max-width:520px;
    padding:0 24px;
  }
  .center h1{
    font-size:clamp(2rem, 6vw, 3.2rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 14px;
    background:linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .center p{
    color:var(--muted);
    font-size:1rem;
    line-height:1.6;
  }
  .dot{
    width:64px;
    height:64px;
    margin:0 auto 18px;
    border-radius:50%;
    background:linear-gradient(145deg, var(--blue-light), var(--blue));
    box-shadow:0 0 40px rgba(41,151,255,0.4);
  }
  .tag{
    display:inline-block;
    margin-top:20px;
    font-size:0.78rem;
    font-weight:600;
    letter-spacing:0.2px;
    color:#fff;
    background:var(--blue);
    padding:8px 18px;
    border-radius:999px;
  }
  .hint{
    position:absolute;
    bottom:28px;
    left:0; right:0;
    text-align:center;
    font-size:0.78rem;
    letter-spacing:0.2px;
    color:var(--muted);
    z-index:2;
    pointer-events:none;
  }
</style>
</head>
<body>
<nav>
  <a class="back" href="../../">‹ Weird October</a>
  <span class="label">Day 2 · Spark</span>
</nav>
<canvas id="c"></canvas>
<div class="center">
  <div class="dot"></div>
  <h1>Strike something.</h1>
  <p>Move your cursor around. Click to really set it off.<br>Everything here starts from one spark.</p>
  <span class="tag">Day 2 · Spark</span>
</div>
<div class="hint">Move or click anywhere</div>

<script>
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W, H;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var particles = [];

  function spawn(x, y, count){
    for (var i = 0; i < count; i++){
      var angle = Math.random() * Math.PI * 2;
      var speed = 1 + Math.random() * 4;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1,
        decay: 0.012 + Math.random() * 0.02,
        size: 1 + Math.random() * 2.5,
        hue: Math.random() < 0.5 ? '41,151,255' : '255,255,255'
      });
    }
  }

  var lastSpawn = 0;
  window.addEventListener('mousemove', function(e){
    var now = Date.now();
    if (now - lastSpawn > 30){
      spawn(e.clientX, e.clientY, 2);
      lastSpawn = now;
    }
  });
  window.addEventListener('touchmove', function(e){
    var t = e.touches[0];
    if (t) spawn(t.clientX, t.clientY, 2);
  });
  window.addEventListener('click', function(e){
    spawn(e.clientX, e.clientY, 40);
  });

  function tick(){
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.vx *= 0.98;
      p.life -= p.decay;
      if (p.life <= 0){
        particles.splice(i, 1);
        continue;
      }
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + p.hue + ',' + p.life + ')';
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();

  setInterval(function(){
    spawn(W/2 + (Math.random()-0.5)*100, H/2 + (Math.random()-0.5)*100, 1);
  }, 150);
</script>
</body>
</html>
