<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 20 · Undefined</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --blue:#0071e3;
    --blue-light:#2997ff;
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% 20%, #12121a, #000 70%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    user-select:none;
  }
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav a.back{ color:var(--blue-light); text-decoration:none; font-size:0.85rem; font-weight:500; }
  nav a.back:hover{ text-decoration:underline; }
  nav .label{ color:var(--muted); font-size:0.8rem; }

  .caption{
    text-align:center;
    margin-bottom:24px;
    max-width:440px;
    padding:0 20px;
  }
  .caption h1{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 10px;
    background:linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .caption p{ color:var(--muted); font-size:0.92rem; line-height:1.6; }

  .mystery{
    width:140px;
    height:140px;
    cursor:pointer;
    transition:border-radius 0.5s var(--ease), transform 0.5s var(--ease), background 0.5s var(--ease);
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }

  .console{
    margin-top:30px;
    width:min(400px, 86vw);
    height:120px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:12px;
    padding:12px 14px;
    font-family:'SF Mono', 'Courier New', monospace;
    font-size:0.78rem;
    line-height:1.6;
    overflow-y:auto;
    text-align:left;
    color:#9aa0a6;
  }
  .console .line{ white-space:pre-wrap; word-break:break-word; }
  .console .q{ color:var(--blue-light); }
  .console .a{ color:#30d158; }
  .console .cursor{
    display:inline-block;
    width:6px;
    height:12px;
    background:var(--blue-light);
    vertical-align:middle;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .tag{
    display:inline-block;
    margin-top:16px;
    font-size:0.78rem;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    padding:8px 18px;
    border-radius:999px;
  }
</style>
</head>
<body>
<nav>
  <a class="back" href="../../">‹ Weird October</a>
  <span class="label">Day 20 · Undefined</span>
</nav>

<div class="caption">
  <h1>What is this?</h1>
  <p>Click it. Ask the console. Neither of you will get a straight answer.</p>
</div>

<div class="mystery" id="mystery"></div>

<div class="console" id="console"></div>
<span class="tag">Day 20 · Undefined</span>

<script>
  var mystery = document.getElementById('mystery');
  var consoleEl = document.getElementById('console');

  var colors = ['#2997ff', '#0071e3', '#30d158', '#ff9f0a', '#ff375f', '#bf5af2', '#64d2ff'];

  function rand(a, b){ return a + Math.random() * (b - a); }

  function shapeShift(){
    var r1 = rand(0, 50), r2 = rand(0, 50), r3 = rand(0, 50), r4 = rand(0, 50);
    mystery.style.borderRadius = r1 + '% ' + r2 + '% ' + r3 + '% ' + r4 + '% / ' +
                                  r4 + '% ' + r3 + '% ' + r2 + '% ' + r1 + '%';
    var c1 = colors[Math.floor(Math.random() * colors.length)];
    var c2 = colors[Math.floor(Math.random() * colors.length)];
    mystery.style.background = 'linear-gradient(' + Math.floor(rand(0,360)) + 'deg, ' + c1 + ', ' + c2 + ')';
    mystery.style.transform = 'rotate(' + rand(-25, 25) + 'deg) scale(' + rand(0.85, 1.1) + ')';
  }

  var clicks = 0;
  function log(){
    clicks++;
    var q = document.createElement('div');
    q.className = 'line q';
    q.textContent = '> typeof mystery';
    var a = document.createElement('div');
    a.className = 'line a';
    a.textContent = '"undefined"';
    consoleEl.appendChild(q);
    consoleEl.appendChild(a);
    consoleEl.appendChild(cursor);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  mystery.addEventListener('click', function(){
    shapeShift();
    log();
  });

  shapeShift();
  var cursor = document.createElement('span');
  cursor.className = 'cursor';
  consoleEl.appendChild(cursor);
</script>
</body>
</html>
