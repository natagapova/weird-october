<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 5 · Sheet</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --blue:#0071e3;
    --blue-light:#2997ff;
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% 100%, #15151a, #000 70%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:none;
  }
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
    cursor:default;
  }
  nav a.back{ color:var(--blue-light); text-decoration:none; font-size:0.85rem; font-weight:500; }
  nav a.back:hover{ text-decoration:underline; }
  nav .label{ color:var(--muted); font-size:0.8rem; }

  .caption{
    position:relative;
    z-index:1;
    max-width:460px;
    padding:0 24px;
  }
  .caption h1{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 12px;
    background:linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .caption p{ color:var(--muted); font-size:0.95rem; line-height:1.6; }
  .tag{
    display:inline-block;
    margin-top:18px;
    font-size:0.78rem;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    padding:8px 18px;
    border-radius:999px;
  }
  .ghost{
    position:fixed;
    top:0; left:0;
    width:90px;
    height:110px;
    pointer-events:none;
    z-index:4;
    transform:translate(-45px, -55px);
    transition:transform 0.05s linear;
    filter:drop-shadow(0 8px 16px rgba(0,113,227,0.35));
  }
  .ghost svg{ width:100%; height:100%; }
  .boo{
    position:fixed;
    z-index:6;
    color:var(--blue-light);
    font-size:0.95rem;
    font-weight:700;
    pointer-events:none;
    animation:floatUp 0.9s var(--ease) forwards;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform:translateY(0); }
    100%{ opacity:0; transform:translateY(-40px); }
  }
</style>
</head>
<body>
<nav>
  <a class="back" href="../../">‹ Weird October</a>
  <span class="label">Day 5 · Sheet</span>
</nav>
<div class="caption">
  <h1>Something's under the sheet.</h1>
  <p>It's following your cursor. Click it if you dare.</p>
  <span class="tag">Day 5 · Sheet</span>
</div>

<div class="ghost" id="ghost">
  <svg viewBox="0 0 100 120">
    <path d="M10,110 L10,55 C10,20 30,5 50,5 C70,5 90,20 90,55 L90,110
             C85,100 78,112 70,100 C62,112 55,100 50,112
             C45,100 38,112 30,100 C22,112 15,100 10,110 Z"
          fill="#f5f5f7" />
    <ellipse cx="38" cy="48" rx="6" ry="9" fill="#0071e3"/>
    <ellipse cx="62" cy="48" rx="6" ry="9" fill="#0071e3"/>
  </svg>
</div>

<script>
  var ghost = document.getElementById('ghost');
  var tx = window.innerWidth / 2, ty = window.innerHeight / 2;
  var gx = tx, gy = ty;

  window.addEventListener('mousemove', function(e){
    tx = e.clientX;
    ty = e.clientY;
  });

  ghost.addEventListener('click', function(e){
    var boo = document.createElement('div');
    boo.className = 'boo';
    boo.textContent = 'boo!';
    boo.style.left = (e.clientX) + 'px';
    boo.style.top = (e.clientY - 40) + 'px';
    document.body.appendChild(boo);
    setTimeout(function(){ boo.remove(); }, 900);

    ghost.animate([
      { transform: ghost.style.transform + ' scale(1)' },
      { transform: ghost.style.transform + ' scale(1.25)' },
      { transform: ghost.style.transform + ' scale(1)' }
    ], { duration: 250 });
  });

  function animate(){
    gx += (tx - gx) * 0.08;
    gy += (ty - gy) * 0.08;
    var sway = Math.sin(Date.now() / 300) * 6;
    ghost.style.transform = 'translate(' + (gx - 45 + sway) + 'px,' + (gy - 55) + 'px)';
    requestAnimationFrame(animate);
  }
  animate();
</script>
</body>
</html>
