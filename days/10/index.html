<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 10 · Layers</title>
<style>
  :root{
    --bg:#000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --blue:#0071e3;
    --blue-light:#2997ff;
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% 20%, #12213a, #000 70%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav a.back{ color:var(--blue-light); text-decoration:none; font-size:0.85rem; font-weight:500; }
  nav a.back:hover{ text-decoration:underline; }
  nav .label{ color:var(--muted); font-size:0.8rem; }

  .caption{
    text-align:center;
    margin-bottom:34px;
    max-width:440px;
    padding:0 20px;
  }
  .caption h1{
    font-size:clamp(1.8rem, 5vw, 2.6rem);
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 10px;
    background:linear-gradient(180deg, #fff, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .caption p{ color:var(--muted); font-size:0.92rem; line-height:1.6; }

  .stack{
    position:relative;
    width:320px;
    height:200px;
  }
  .layer{
    position:absolute;
    inset:0;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    font-size:1rem;
    font-weight:500;
    color:var(--ink);
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    transition:transform 0.6s var(--ease), opacity 0.6s var(--ease);
    cursor:pointer;
  }
  .layer .hint{
    position:absolute;
    bottom:12px;
    left:0; right:0;
    font-size:0.68rem;
    color:var(--muted);
    font-weight:400;
  }
  .layer.gone{
    transform:translateY(-60px) rotate(-8deg) scale(0.9);
    opacity:0;
    pointer-events:none;
  }
  .tag{
    display:inline-block;
    margin-top:30px;
    font-size:0.78rem;
    font-weight:600;
    color:#fff;
    background:var(--blue);
    padding:8px 18px;
    border-radius:999px;
  }
</style>
</head>
<body>
<nav>
  <a class="back" href="../../">‹ Weird October</a>
  <span class="label">Day 10 · Layers</span>
</nav>

<div class="caption">
  <h1>Peel it back.</h1>
  <p>Click the top layer to remove it. There's something different underneath each one.</p>
</div>

<div class="stack" id="stack"></div>
<span class="tag">Day 10 · Layers</span>

<script>
  var messages = [
    "This is layer one. Click to peel it away.",
    "Layer two. Everything is made of layers, if you look.",
    "Layer three. Getting closer now.",
    "Layer four. Almost there.",
    "This is the bottom. There's nothing under this one — just the page itself."
  ];

  var stack = document.getElementById('stack');
  var n = messages.length;

  for (var i = 0; i < n; i++){
    var layer = document.createElement('div');
    layer.className = 'layer';
    layer.style.zIndex = n - i;
    var depth = (n - 1 - i);
    layer.style.transform = 'translate(' + (depth * -4) + 'px,' + (depth * 6) + 'px) scale(' + (1 - depth * 0.03) + ')';

    var text = document.createElement('div');
    text.textContent = messages[i];
    layer.appendChild(text);

    if (i < n - 1){
      var hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = 'click to peel';
      layer.appendChild(hint);
    }

    (function(layer){
      layer.addEventListener('click', function(){
        if (layer.classList.contains('gone')) return;
        layer.classList.add('gone');
      });
    })(layer);

    stack.appendChild(layer);
  }
</script>
</body>
</html>
