<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weird October</title>
<style>
  :root{
    --bg:#000000;
    --ink:#f5f5f7;
    --muted:#86868b;
    --blue:#0071e3;
    --blue-light:#2997ff;
    --card:#1c1c1e;
    --card-border:rgba(255,255,255,0.12);
    --glass:rgba(255,255,255,0.06);
    --glass-strong:rgba(255,255,255,0.12);
    --ease:cubic-bezier(.28,0,0,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    background:var(--bg);
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- nav ---------- */
  nav{
    position:fixed;
    top:0; left:0; right:0;
    z-index:50;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  nav .mark{
    font-size:0.92rem;
    font-weight:600;
    letter-spacing:-0.2px;
    color:var(--ink);
    text-decoration:none;
  }
  nav a.ext{
    font-size:0.8rem;
    color:var(--muted);
    text-decoration:none;
  }
  nav a.ext:hover{color:var(--ink);}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    padding:150px 20px 60px;
    text-align:center;
    overflow:hidden;
  }
  .glow{
    position:absolute;
    top:-220px;
    left:50%;
    width:900px;
    height:600px;
    transform:translateX(-50%);
    background:
      radial-gradient(circle at 30% 50%, rgba(255,69,58,0.35), transparent 60%),
      radial-gradient(circle at 70% 40%, rgba(94,92,230,0.3), transparent 60%),
      radial-gradient(circle at 50% 70%, rgba(48,209,88,0.25), transparent 60%);
    filter:blur(10px);
    animation:glowMove 18s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes glowMove{
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-46%) scale(1.08); }
  }
  .eyebrow{
    position:relative;
    display:inline-block;
    font-size:0.8rem;
    font-weight:600;
    letter-spacing:0.3px;
    color:var(--blue-light);
    margin-bottom:14px;
    opacity:0;
    animation:riseIn 0.8s var(--ease) 0.05s forwards;
  }
  h1{
    position:relative;
    font-size:clamp(2.6rem, 8vw, 5.2rem);
    font-weight:700;
    letter-spacing:-0.03em;
    line-height:1.05;
    margin:0;
    background:linear-gradient(180deg, #fff 20%, #a1a1a6);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation:riseIn 0.9s var(--ease) 0.15s forwards;
  }
  .hero p{
    position:relative;
    max-width:460px;
    margin:18px auto 0;
    color:var(--muted);
    font-size:1.05rem;
    line-height:1.5;
    opacity:0;
    animation:riseIn 0.9s var(--ease) 0.3s forwards;
  }
  .progress-pill{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:26px;
    padding:7px 16px;
    border-radius:999px;
    background:var(--glass);
    border:1px solid var(--card-border);
    backdrop-filter:blur(10px);
    font-size:0.78rem;
    color:var(--ink);
    opacity:0;
    animation:riseIn 0.9s var(--ease) 0.42s forwards;
  }
  .progress-pill .live{
    width:6px; height:6px;
    border-radius:50%;
    background:#30d158;
    box-shadow:0 0 8px #30d158;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes riseIn{
    0%{ opacity:0; transform:translateY(22px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  @keyframes pulse{
    0%,100%{ opacity:0.4; }
    50%{ opacity:1; }
  }

  /* ---------- calendar section ---------- */
  .section{
    position:relative;
    max-width:900px;
    margin:0 auto;
    padding:20px 20px 120px;
  }
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:12px;
    margin-bottom:12px;
  }
  .weekdays div{
    text-align:center;
    font-size:0.72rem;
    font-weight:600;
    color:var(--muted);
    letter-spacing:0.5px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:12px;
  }
  .cell{
    aspect-ratio:1;
    perspective:1000px;
  }
  .cell.blank{visibility:hidden;}

  .flip{
    position:relative;
    width:100%;
    height:100%;
    transition:transform 0.7s var(--ease);
    transform-style:preserve-3d;
    opacity:0;
    animation:cardIn 0.6s var(--ease) backwards;
  }
  @keyframes cardIn{
    0%{ opacity:0; transform:translateY(16px) scale(0.92); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  .cell:hover .flip{
    transform:rotateY(180deg) scale(1.04);
  }

  .face{
    position:absolute;
    inset:0;
    border-radius:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    backface-visibility:hidden;
    background:var(--card);
    border:1px solid var(--card-border);
    text-decoration:none;
    color:var(--ink);
    overflow:hidden;
    transition:border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
    box-shadow:0 1px 0 rgba(255,255,255,0.05) inset;
  }
  .face::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(145deg, rgba(255,255,255,0.08), transparent 55%);
    pointer-events:none;
  }
  .face.front .num{
    font-size:1.3rem;
    font-weight:600;
    letter-spacing:-0.02em;
    color:var(--ink);
    position:relative;
    z-index:1;
  }
  .face.back{
    transform:rotateY(180deg);
    padding:8px;
    text-align:center;
    background:var(--glass-strong);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
  }
  .face.back .theme{
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:0.2px;
    line-height:1.3;
    word-break:break-word;
    position:relative;
    z-index:1;
  }

  .cell.ready .flip:hover{ cursor:pointer; }
  .cell.ready .face.front{
    border-color:rgba(0,113,227,0.5);
    box-shadow:0 0 0 1px rgba(0,113,227,0.15) inset, 0 8px 20px rgba(0,113,227,0.08);
  }
  .cell.ready .face.back{
    border-color:var(--blue-light);
    color:var(--blue-light);
  }
  .cell.ready .face.back .theme{ color:var(--blue-light); }
  .cell.ready .dot{
    position:absolute;
    top:8px; right:8px;
    width:6px; height:6px;
    border-radius:50%;
    background:#30d158;
    box-shadow:0 0 8px #30d158;
    z-index:1;
    animation:pulse 2.4s ease-in-out infinite;
  }

  .cell.locked .face{ opacity:0.4; }
  .cell.locked .face.front .num{ color:var(--muted); }
  .cell.locked .face.back .theme{ color:var(--muted); }

  .cell.today .face.front{
    border-color:var(--blue);
    box-shadow:0 0 0 1px var(--blue) inset;
  }

  .cell:hover .face.front{
    transform:scale(1.02);
  }

  footer{
    position:relative;
    text-align:center;
    padding:24px 20px 60px;
    color:var(--muted);
    font-size:0.78rem;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  footer a{ color:var(--blue-light); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }

  @media (hover:none){
    .cell:active .flip{ transform:rotateY(180deg); }
  }
</style>
</head>
<body>
  <nav>
    <a class="mark" href="#">Weird October</a>
    <a class="ext" href="https://weirdweboctober.website" target="_blank" rel="noopener">weirdweboctober.website ↗</a>
  </nav>

  <section class="hero">
    <div class="glow"></div>
    <div class="eyebrow">October 2026</div>
    <h1>Thirty-one days.<br>One weird site each.</h1>
    <p>A tiny experiment, built one day at a time. Hover a day on the calendar to see what it's about.</p>
    <div class="progress-pill"><span class="live"></span>Day 9 of 31 live</div>
  </section>

  <div class="section">
    <div class="weekdays">
      <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <footer>
    Made for <a href="https://weirdweboctober.website" target="_blank" rel="noopener">Weird Web October</a> · not affiliated with Apple
  </footer>

<script>
  // October 2026: 1st is a Thursday
  var FIRST_WEEKDAY = 4; // 0=Su ... 4=Th
  var DAYS_IN_MONTH = 31;

  var themes = {
    1:"Reveal", 2:"Spark", 3:"Fake", 4:"Plastic", 5:"Sheet",
    6:"Analog", 7:"Organic", 8:"Skeumorphism", 9:"Spicy", 10:"Layers",
    11:"Stuck", 12:"Pointy", 13:"Scratch", 14:"Origami", 15:"Wooden",
    16:"Instant", 17:"Branching", 18:"Geometric", 19:"Distorted", 20:"Undefined",
    21:"Illusion", 22:"Skeletons", 23:"Incognito", 24:"Collage", 25:"Ascending",
    26:"Net", 27:"Spiral", 28:"Smooth", 29:"The End", 30:"Pastel", 31:"Spooky"
  };

  // days that actually have a finished page, update this as you build more
  var built = [1, 2, 3, 4, 5, 6, 7, 8, 9];

  var now = new Date();
  var isOctober2026 = (now.getFullYear() === 2026 && now.getMonth() === 9);
  var todayDate = isOctober2026 ? now.getDate() : 0;

  var grid = document.getElementById('grid');

  for (var i = 0; i < FIRST_WEEKDAY; i++) {
    var blank = document.createElement('div');
    blank.className = 'cell blank';
    grid.appendChild(blank);
  }

  for (var d = 1; d <= DAYS_IN_MONTH; d++) {
    var cell = document.createElement('div');
    var isBuilt = built.indexOf(d) !== -1;
    var isToday = d === todayDate;
    cell.className = 'cell' + (isBuilt ? ' ready' : ' locked') + (isToday ? ' today' : '');

    var flip = document.createElement('div');
    flip.className = 'flip';
    flip.style.animationDelay = (d * 0.02) + 's';

    var front = document.createElement('div');
    front.className = 'face front';
    var num = document.createElement('div');
    num.className = 'num';
    num.textContent = String(d).padStart(2,'0');
    front.appendChild(num);
    if (isBuilt){
      var dot = document.createElement('div');
      dot.className = 'dot';
      front.appendChild(dot);
    }

    var back = document.createElement(isBuilt ? 'a' : 'div');
    back.className = 'face back';
    if (isBuilt) back.href = 'days/' + String(d).padStart(2,'0') + '/';
    var theme = document.createElement('div');
    theme.className = 'theme';
    theme.textContent = isBuilt ? themes[d] : 'coming soon';
    back.appendChild(theme);

    flip.appendChild(front);
    flip.appendChild(back);
    cell.appendChild(flip);
    grid.appendChild(cell);
  }
</script>
</body>
</html>
